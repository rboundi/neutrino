name: Bug report
description: Something doesn't work or is coloured wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Text that reproduces it
      description: The smallest snippet that shows the problem, and the syntax in use.
      render: text
  - type: input
    id: versions
    attributes:
      label: Neutrino and macOS versions
      placeholder: Neutrino 1.0.0 on macOS 15.3
    validations:
      required: true
